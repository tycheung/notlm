name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Merge-blocking vibe-ship gate (see docs/MERGE_GATES.md). Keep this job id stable
  # for future branch-protection required checks.
  vibe-ship-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: PR handoff body gate
        run: npm run check:pr-handoff

      - name: Static vibe-ship invariants
        run: npm run check:vibe-ship

      - name: God-component size containment
        run: npm run check:god-components

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Enforce naive UTC datetime policy
        run: npm run check:datetime

      - name: God-component size containment
        run: npm run check:god-components

      - name: ESLint API tier (strict)
        run: npm run lint:api

      - name: ESLint side-action tier
        run: npm run lint:side-actions

      - name: Unit tests with coverage
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Checkout fastapi-backend for live Playwright
        uses: actions/checkout@v4
        with:
          repository: VictoryBowlingSoftware/fastapi-backend
          path: backend
          ssh-key: ${{ secrets.E2E_BACKEND_CHECKOUT_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install "poetry<3"

      - name: Install backend runtime dependencies
        working-directory: backend
        run: poetry install --only main

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright live e2e (exclude @fullflow)
        env:
          CI: "true"
        run: npm run test:e2e -- --grep-invert @fullflow

  deploy-green:
    name: Deploy green (staging)
    needs: [vibe-ship-invariants, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://api.victorybowling.com
          VITE_PUBLIC_APP_URL: https://app.victorybowling.com
          VITE_LIVE_SCORES_CDN: "1"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Release metadata
        id: meta
        run: |
          echo "release_id=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying green release: ${GITHUB_SHA}"

      - name: Upload release to S3
        env:
          BUCKET: ${{ secrets.S3_BUCKET }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          aws s3 sync dist/ "s3://${BUCKET}/releases/${RELEASE_ID}/" \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.html"
          aws s3 sync dist/ "s3://${BUCKET}/releases/${RELEASE_ID}/" \
            --exclude "*" \
            --include "*.html" \
            --cache-control "no-cache,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Point staging origin path at this release
        env:
          STAGING_ID: ${{ secrets.CLOUDFRONT_STAGING_DISTRIBUTION_ID }}
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          set -euo pipefail
          aws cloudfront get-distribution-config --id "$STAGING_ID" > /tmp/staging-full.json
          ETAG=$(jq -r '.ETag' /tmp/staging-full.json)
          jq --arg path "/releases/${RELEASE_ID}" '
            .DistributionConfig
            | .Origins.Items[0].OriginPath = $path
          ' /tmp/staging-full.json > /tmp/staging-config.json

          aws cloudfront update-distribution \
            --id "$STAGING_ID" \
            --if-match "$ETAG" \
            --distribution-config file:///tmp/staging-config.json

      - name: Wait until staging is Deployed
        env:
          STAGING_ID: ${{ secrets.CLOUDFRONT_STAGING_DISTRIBUTION_ID }}
        run: aws cloudfront wait distribution-deployed --id "$STAGING_ID"

      - name: Re-enable continuous deployment policy (needed after prior Promote)
        env:
          POLICY_ID: ${{ secrets.CLOUDFRONT_CONTINUOUS_DEPLOYMENT_POLICY_ID }}
        run: |
          set -euo pipefail
          aws cloudfront get-continuous-deployment-policy-config --id "$POLICY_ID" \
            > /tmp/cd-policy-full.json
          if [ "$(jq -r '.ContinuousDeploymentPolicyConfig.Enabled' /tmp/cd-policy-full.json)" = "true" ]; then
            echo "Continuous deployment policy already enabled"
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            aws cloudfront get-continuous-deployment-policy-config --id "$POLICY_ID" \
              > /tmp/cd-policy-full.json
            ETAG=$(jq -r '.ETag' /tmp/cd-policy-full.json)
            jq '.ContinuousDeploymentPolicyConfig | .Enabled = true' \
              /tmp/cd-policy-full.json > /tmp/cd-policy-config.json
            if aws cloudfront update-continuous-deployment-policy \
              --id "$POLICY_ID" \
              --if-match "$ETAG" \
              --continuous-deployment-policy-config file:///tmp/cd-policy-config.json; then
              exit 0
            fi
            echo "Policy update attempt ${attempt} failed; waiting 30s"
            sleep 30
          done
          echo "Failed to re-enable continuous deployment policy after retries"
          exit 1

      - name: Invalidate staging cache
        id: invalidate
        env:
          STAGING_ID: ${{ secrets.CLOUDFRONT_STAGING_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          INV_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$STAGING_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "invalidation_id=${INV_ID}" >> "$GITHUB_OUTPUT"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$STAGING_ID" \
            --id "$INV_ID"

      - name: Print how to test green
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
        run: |
          cat <<EOF
          Green deploy complete: releases/${RELEASE_ID}
          Staging is Deployed and cache invalidation finished.

          Test:
            curl -sI -H "aws-cf-cd-staging: 1" https://app.victorybowling.com/

          Browser: ModHeader / Requestly → request header aws-cf-cd-staging = 1

          When ready to go live:
            AWS Console → CloudFront → Distributions → PRIMARY E1EJHVNFFTSUKA
            → Continuous deployment → Promote
            → wait until primary is Deployed
            → invalidate primary /*
          EOF
